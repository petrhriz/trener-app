# Nasazení na Cloudflare z GitHubu (bez počítače a bez Claude Code).
# Potřebné secrets v repozitáři: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (viz AGENTS.md).
# Spouští se ručně (Actions → Deploy → Run workflow). Automaticky po pushi do main jen když je proměnná
# repozitáře AUTO_DEPLOY = true (Settings → Secrets and variables → Actions → Variables).
name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/stamp.mjs
      - run: npx wrangler d1 migrations apply trener-db --remote
      - run: node scripts/deploy-worker.mjs
